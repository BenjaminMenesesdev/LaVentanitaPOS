version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: laventanita-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: laventanita
      POSTGRES_USER: laventanita_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laventanita_user -d laventanita"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ventanita-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laventanita-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=laventanita
      - DB_USERNAME=laventanita_user
      - DB_PASSWORD=${DB_PASSWORD}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
    expose: ["9000"]
    networks: [ventanita-network]
    # Corre migraciones y seeders antes de arrancar php-fpm. El Dockerfile original
    # no tenia ningun paso que migrara la base, por lo que el backend levantaba sin tablas.
    # migrate:fresh es seguro aqui porque este compose es para uso LOCAL (sin datos reales
    # que resguardar). Si se usa contra una base con datos reales, cambiar a "migrate --force".
    entrypoint: ["/bin/sh", "-c", "php artisan migrate:fresh --seed --force && php-fpm"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite necesita esto en tiempo de build, no de runtime (ver frontend/Dockerfile).
        VITE_API_URL: /api
    container_name: laventanita-frontend
    restart: unless-stopped
    expose: ["80"]
    depends_on: [backend]
    networks: [ventanita-network]

  nginx:
    image: nginx:alpine
    container_name: laventanita-nginx
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    networks: [ventanita-network]

volumes:
  db_data:

networks:
  ventanita-network:
    driver: bridge
